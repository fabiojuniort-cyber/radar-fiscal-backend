name: L15 L10 Isolated PG18 Security and Retention

on:
  pull_request:
    branches: [main]
    paths:
      - 'migrations/054_l15_scope_purge_and_l10_runner.sql'
      - 'migrations/055_collection_items_created_at_index.sql'
      - 'migrations/068_f3_unified_type_decision.sql'
      - 'src/modules/collection/collection-filter.*.ts'
      - 'src/modules/collection/collection.engine.ts'
      - 'src/api/routes/catalog-monitoring.route.ts'
      - 'src/modules/collection/collection-filter.scope-purge.ts'
      - 'src/scheduler.ts'
      - 'src/api/routes/collection-filter-admin.route.ts'
      - 'test/collection-filter.l15-scope-purge.integration.test.ts'
      - 'test/collection-filter.f3*.test.ts'
      - '.github/workflows/l15-l10-pg18.yml'

permissions:
  contents: read

jobs:
  pg18-l15-l10:
    name: PG18 guarded scope purge and retention-only privileges
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: radar_fiscal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/radar_fiscal_test
      DATABASE_URL: postgresql://radar_app_runtime:ci-runtime-password-with-at-least-32-chars@localhost:5432/radar_fiscal_test
      DB_RUNTIME_PASSWORD: ci-runtime-password-with-at-least-32-chars
      DB_WORKER_RUNTIME_PASSWORD: ci-worker-password-with-at-least-32-chars
      DB_CURATOR_RUNTIME_PASSWORD: ci-curator-password-with-at-least-32-chars
      JWT_ACCESS_SECRET: ci-jwt-secret-with-at-least-32-characters
      AUTH_REFRESH_COOKIE_NAME: radar_refresh_token
      PUBLIC_API_ALLOWED_ORIGINS: https://public.example
      DB_POOL_MAX: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply migrations including 054 and index-only 055
        run: npm run db:prepare
      - name: Guarded L15 preview/confirm and L10 privileges on PG18
        run: npx tsx --test test/collection-filter.l15-scope-purge.integration.test.ts
      - name: F3 shared decisions, preview confirmations and company/origin guards
        run: npx tsx --test test/collection-filter.f3.integration.test.ts
      - name: F3 physical survivors across lists, detail, facets and public counters
        run: npx tsx --test test/collection-filter.f3-catalog.integration.test.ts
