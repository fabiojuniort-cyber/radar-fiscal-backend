name: LOTE-2 Isolated PostgreSQL 18

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'src/modules/operations/collection-items-retention.ts'
      - 'src/infrastructure/database/prune-collection-items.ts'
      - 'test/collection-items-retention.integration.test.ts'
      - 'src/modules/collection/doe-sp.connector.ts'
      - 'test/doe-sp.auth-pdf.unit.test.ts'
      - 'test/doe-sp.connector.unit.test.ts'
      - 'test/doe-sp.collection.integration.test.ts'
      - 'package.json'
      - '.github/workflows/lote2-pg18-isolated.yml'

permissions:
  contents: read

jobs:
  lote2-pg18:
    name: LOTE2 tests and dry-run on isolated PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: radar_fiscal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/radar_fiscal_test
      DATABASE_URL: postgresql://radar_app_runtime:ci-runtime-password-with-at-least-32-chars@localhost:5432/radar_fiscal_test
      DB_RUNTIME_PASSWORD: ci-runtime-password-with-at-least-32-chars
      DB_CURATOR_RUNTIME_PASSWORD: ci-curator-password-with-at-least-32-chars
      JWT_ACCESS_SECRET: ci-jwt-secret-with-at-least-32-characters
      AUTH_REFRESH_COOKIE_NAME: radar_refresh_token
      PUBLIC_API_ALLOWED_ORIGINS: https://public.example
      DB_POOL_MAX: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Unit regression L-05
        run: npx tsx --test test/doe-sp.connector.unit.test.ts test/doe-sp.auth-pdf.unit.test.ts
      - name: Prepare isolated PostgreSQL 18
        run: npm run db:prepare
      - name: L-08 orphan integration and L-10 retention + L-05 collection
        run: npx tsx --test test/publication.presentation.integration.test.ts test/collection-items-retention.integration.test.ts test/doe-sp.collection.integration.test.ts
      - name: L-10 CLI default is dry-run
        run: npm run db:prune-collection-items
