name: AUTH-RESET-04 isolated PG16 PG18

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/auth-reset-pg18.yml'
      - 'migrations/083_auth_password_reset.sql'
      - 'src/api/routes/password-reset.route.ts'
      - 'src/modules/auth/password-reset.service.ts'
      - 'src/modules/auth/auth.service.ts'
      - 'src/app.ts'
      - 'src/config/env.ts'
      - 'src/infrastructure/logging/logger.ts'
      - 'test/password-reset.unit.test.ts'
      - 'test/password-reset.integration.test.ts'
      - 'test/password-reset.latency.integration.test.ts'
      - 'test/password-reset.r3.adversarial.integration.test.ts'
      - 'migrations/084_auth_password_reset_r3.sql'
      - 'migrations/085_auth_reset_health_retention_r4.sql'
      - 'test/password-reset.r4.before.integration.test.ts'
      - 'test/password-reset.r4.health-retention.integration.test.ts'
      - 'src/modules/auth/password-reset.worker.ts'
      - 'src/worker.ts'
      - 'test/password-reset.worker.unit.test.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset-pg18:
    name: Contract and simulated inbox on disposable PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-bookworm
        env:
          POSTGRES_DB: radar_fiscal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/radar_fiscal_test
      DATABASE_URL: postgresql://radar_app_runtime:ci-runtime-password-with-at-least-32-chars@localhost:5432/radar_fiscal_test
      DB_RUNTIME_PASSWORD: ci-runtime-password-with-at-least-32-chars
      DB_CURATOR_RUNTIME_PASSWORD: ci-curator-password-with-at-least-32-chars
      JWT_ACCESS_SECRET: ci-jwt-secret-with-at-least-32-characters
      AUTH_REFRESH_COOKIE_NAME: radar_refresh_token
      PUBLIC_API_ALLOWED_ORIGINS: https://public.example
      AUTH_PASSWORD_RESET_ENABLED: 'false'
      DB_POOL_MAX: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (no Zoho credentials)
        run: npm ci
      - name: Typecheck and build
        run: npm run typecheck && npm run build
      - name: Apply migrations to disposable PostgreSQL (matrix major)
        run: npm run db:prepare
      - name: Fully simulated Zoho request (no network)
        run: npx tsx --test test/password-reset.unit.test.ts
      - name: Password reset roundtrip, captured link and revoked sessions
        run: npx tsx --test test/password-reset.integration.test.ts
      - name: B-1 temporal proof with protected production-like request floor
        run: npx tsx --test test/password-reset.latency.integration.test.ts
      - name: R4 dual queue health, recovery and retention in disposable PostgreSQL
        run: npx tsx --test test/password-reset.r4.health-retention.integration.test.ts
      - name: R3 real PostgreSQL lock and partial failure non-enumeration
        run: npx tsx --test test/password-reset.r3.adversarial.integration.test.ts
      - name: Authentication, session rotation, tenant isolation and public signup RLS
        run: npx tsx --test test/auth.integration.test.ts && npx tsx --test test/public-signup.integration.test.ts
