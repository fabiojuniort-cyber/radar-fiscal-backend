name: AUTH-RESET-04 isolated PG16 PG18

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/auth-reset-pg18.yml'
      - 'migrations/083_auth_password_reset.sql'
      - 'src/api/routes/password-reset.route.ts'
      - 'src/modules/auth/password-reset.service.ts'
      - 'src/modules/auth/auth.service.ts'
      - 'src/app.ts'
      - 'src/config/env.ts'
      - 'src/infrastructure/logging/logger.ts'
      - 'test/password-reset.unit.test.ts'
      - 'test/password-reset.integration.test.ts'
      - 'test/password-reset.latency.integration.test.ts'
      - 'test/password-reset.r3.adversarial.integration.test.ts'
      - 'migrations/084_auth_password_reset_r3.sql'
      - 'migrations/085_auth_reset_health_retention_r4.sql'
      - 'test/password-reset.r4.before.integration.test.ts'
      - 'test/password-reset.r4.health-retention.integration.test.ts'
      - 'src/modules/auth/password-reset.worker.ts'
      - 'src/worker.ts'
      - 'test/password-reset.worker.unit.test.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset-pg18:
    name: Contract and simulated inbox on disposable PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-bookworm
        env:
          POSTGRES_DB: radar_fiscal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/radar_fiscal_test
      DATABASE_URL: postgresql://radar_app_runtime:ci-runtime-password-with-at-least-32-chars@localhost:5432/radar_fiscal_test
      DB_RUNTIME_PASSWORD: ci-runtime-password-with-at-least-32-chars
      DB_CURATOR_RUNTIME_PASSWORD: ci-curator-password-with-at-least-32-chars
      JWT_ACCESS_SECRET: ci-jwt-secret-with-at-least-32-characters
      AUTH_REFRESH_COOKIE_NAME: radar_refresh_token
      PUBLIC_API_ALLOWED_ORIGINS: https://public.example
      AUTH_PASSWORD_RESET_ENABLED: 'false'
      DB_POOL_MAX: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (no Zoho credentials)
        run: npm ci
      - name: Typecheck and build
        run: npm run typecheck && npm run build
      - name: Apply migrations to disposable PostgreSQL (matrix major)
        run: npm run db:prepare
      - name: Fully simulated Zoho request (no network)
        run: npx tsx --test test/password-reset.unit.test.ts
      - name: Password reset roundtrip, captured link and revoked sessions
        run: npx tsx --test test/password-reset.integration.test.ts
      - name: B-1 temporal proof with protected production-like request floor
        run: npx tsx --test test/password-reset.latency.integration.test.ts
      - name: R4 dual queue health, recovery and retention in disposable PostgreSQL
        run: npx tsx --test test/password-reset.r4.health-retention.integration.test.ts
      - name: R3 real PostgreSQL lock and partial failure non-enumeration
        run: npx tsx --test test/password-reset.r3.adversarial.integration.test.ts
      - name: Authentication, session rotation, tenant isolation and public signup RLS
        run: npx tsx --test test/auth.integration.test.ts && npx tsx --test test/public-signup.integration.test.ts

  reset-production-path:
    # COORD F2 (#9): production-path proof. The database is first brought to the exact state of main d53fb3e2
    # (its own migrations, including 083_onb02_r7_backfill_batch_stable_plan.sql, applied by main's own runner);
    # then this PR's runner applies the exact forward delta, starting with the reset migrations (083_auth…, 084, 085).
    name: Production path (main d53fb3e2 → reset migrations) on PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-bookworm
        env:
          POSTGRES_DB: radar_fiscal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      MAIN_STATE_SHA: d53fb3e2b8d34b9fbeda4da6c5fbdf25a24c19e9
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/radar_fiscal_test
      DATABASE_URL: postgresql://radar_app_runtime:ci-runtime-password-with-at-least-32-chars@localhost:5432/radar_fiscal_test
      DB_RUNTIME_PASSWORD: ci-runtime-password-with-at-least-32-chars
      DB_CURATOR_RUNTIME_PASSWORD: ci-curator-password-with-at-least-32-chars
      JWT_ACCESS_SECRET: ci-jwt-secret-with-at-least-32-characters
      AUTH_REFRESH_COOKIE_NAME: radar_refresh_token
      PUBLIC_API_ALLOWED_ORIGINS: https://public.example
      AUTH_PASSWORD_RESET_ENABLED: 'false'
      DB_POOL_MAX: 1
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (no Zoho credentials)
        run: npm ci
      - name: Main state — apply main d53fb3e2 migrations with main's own runner
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/main-state" "$MAIN_STATE_SHA"
          # same lockfile as this PR (checked below), so the installed dependencies are reused
          git diff --quiet "$MAIN_STATE_SHA" HEAD -- package-lock.json
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/main-state/node_modules"
          cd "$RUNNER_TEMP/main-state"
          npm run build
          npm run db:prepare
      - name: Main state — ledger has 083_onb02 and no reset migration
        run: |
          set -euo pipefail
          q() { psql -h localhost -U postgres -d radar_fiscal_test -tAc "$1"; }
          main_count=$(git ls-tree --name-only "$MAIN_STATE_SHA" migrations/ | grep -cE '^migrations/[0-9]{3}_.+\.sql$')
          test "$(q "select count(*) from schema_migrations")" = "$main_count"
          test "$(q "select count(*) from schema_migrations where filename = '083_onb02_r7_backfill_batch_stable_plan.sql'")" = "1"
          test "$(q "select count(*) from schema_migrations where filename ~ '^08[345]_auth'")" = "0"
          echo "main state OK: $main_count migrations, 083_onb02 applied, no reset migration"
      - name: Typecheck and build (this PR)
        run: npm run typecheck && npm run build
      - name: This PR's runner applies exactly the forward delta starting with the reset migrations
        run: |
          set -euo pipefail
          # Preserve the original reset ordering proof when later migrations compose with AUTH.
          git diff --quiet --no-renames --diff-filter=CDMRTUXB "$MAIN_STATE_SHA" HEAD -- migrations/
          git diff --name-only --diff-filter=A "$MAIN_STATE_SHA" HEAD -- migrations/ \
            | sed -nE 's@^migrations/([0-9]{3}_.+\.sql)$@\1@p' | LC_ALL=C sort > "$RUNNER_TEMP/reset-expected-migrations"
          printf '%s\n' 083_auth_password_reset.sql 084_auth_password_reset_r3.sql 085_auth_reset_health_retention_r4.sql \
            | diff -u - <(head -n 3 "$RUNNER_TEMP/reset-expected-migrations")
          npm run db:prepare 2>&1 | tee "$RUNNER_TEMP/prepare.log"
          grep -F 'Migration already applied: 083_onb02_r7_backfill_batch_stable_plan.sql' "$RUNNER_TEMP/prepare.log"
          sed -n 's/^Applying migration: //p' "$RUNNER_TEMP/prepare.log" \
            | diff -u "$RUNNER_TEMP/reset-expected-migrations" -
      - name: Ledger order — 083_onb02 applied before the reset migrations (production order)
        run: |
          set -euo pipefail
          q() { psql -h localhost -U postgres -d radar_fiscal_test -tAc "$1"; }
          q "select filename, applied_at from schema_migrations where filename ~ '^08[2-5]_' order by applied_at, filename"
          test "$(q "select (select applied_at from schema_migrations where filename = '083_onb02_r7_backfill_batch_stable_plan.sql') < (select min(applied_at) from schema_migrations where filename ~ '^08[345]_auth')")" = "t"
      - name: Password reset roundtrip, captured link and revoked sessions
        run: npx tsx --test test/password-reset.integration.test.ts
      - name: B-1 temporal proof with protected production-like request floor
        run: npx tsx --test test/password-reset.latency.integration.test.ts
      - name: R4 dual queue health, recovery and retention
        run: npx tsx --test test/password-reset.r4.health-retention.integration.test.ts
      - name: R3 real PostgreSQL lock and partial failure non-enumeration
        run: npx tsx --test test/password-reset.r3.adversarial.integration.test.ts
      - name: Fully simulated Zoho request (no network)
        run: npx tsx --test test/password-reset.unit.test.ts
      - name: Authentication, session rotation, tenant isolation and public signup RLS
        run: npx tsx --test test/auth.integration.test.ts && npx tsx --test test/public-signup.integration.test.ts
