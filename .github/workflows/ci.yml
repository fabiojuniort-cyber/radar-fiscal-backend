name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches:
      - main
  push:
    branches:
      - main

# Replace only older runs of the same PR. Non-PR runs have independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      full_regression: ${{ steps.ci-plan.outputs.full_regression }}
      pg18_required: ${{ steps.ci-plan.outputs.pg18_required }}

    services:
      postgres:
        # An empty image disables the service for draft fast checks.
        image: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && 'postgres:16' || '' }}
        env:
          POSTGRES_DB: radar_fiscal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/radar_fiscal_test
      DATABASE_URL: postgresql://radar_app_runtime:ci-runtime-password-with-at-least-32-chars@localhost:5432/radar_fiscal_test
      DB_RUNTIME_PASSWORD: ci-runtime-password-with-at-least-32-chars
      DB_CURATOR_RUNTIME_PASSWORD: ci-curator-password-with-at-least-32-chars
      JWT_ACCESS_SECRET: ci-jwt-secret-with-at-least-32-characters
      AUTH_REFRESH_COOKIE_NAME: radar_refresh_token
      PUBLIC_API_ALLOWED_ORIGINS: https://public.example
      DB_POOL_MAX: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Validate CI routing
        run: python3 -m unittest discover -s .github/scripts -p test_ci_plan.py

      - name: Plan CI gates
        id: ci-plan
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_DRAFT: ${{ github.event.pull_request.draft || false }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/ci-plan.py --kind backend

      - name: DOU-CLEAN-02 runner offline guards
        if: steps.ci-plan.outputs.pg18_required == 'true'
        # No secrets, PostgreSQL, HTTP or Railway access.
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep jq
          env -i PATH="$PATH" bash ops/dou-clean-02/runner/test-static.sh

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Generate TAX-06 baseline manifest
        run: npm run taxonomy:baseline:manifest -- --write

      - name: Validate TAX-06 baseline
        run: npm run taxonomy:baseline:validate

      - name: TAX-06 baseline unit tests
        run: npm run test:taxonomy-baseline-unit

      - name: Upload generated TAX-06 manifest
        # Diagnostic copy only: the byte-identity check below is the gate.
        # A full artifact quota must not fail the build.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tax-06-baseline-manifest
          path: docs/taxonomy/baseline/TAXONOMY_BASELINE_V1_MANIFEST.json
          retention-days: 1

      - name: Verify committed TAX-06 manifest is byte-identical
        shell: bash
        run: |
          git diff --exit-code -- docs/taxonomy/baseline/TAXONOMY_BASELINE_V1_MANIFEST.json
          test -z "$(git status --porcelain -- docs/taxonomy/baseline/TAXONOMY_BASELINE_V1_MANIFEST.json)"

      - name: ANAT-04 isolated core checks (offline)
        run: npm run anatomy:verify-build && npm run test:anatomy

      - name: Unit tests
        run: npm test

      - name: RFB news unit tests
        run: npx tsx --test test/rfb-news.parser.unit.test.ts test/rfb-news.filter.unit.test.ts test/rfb-news.connector.unit.test.ts

      - name: NCM catalog parser unit tests
        run: npx tsx --test test/ncm-catalog.source.unit.test.ts

      - name: Publication NCM detector unit tests
        run: npx tsx --test test/publication-ncm.detector.unit.test.ts

      - name: Prepare PostgreSQL test database
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npm run db:prepare

      - name: Clean synthetic legacy audit fixtures before regression (isolated CI only)
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: node ops/onb02/audit-backfill.mjs --apply --ack-irreversible-r7

      - name: NEWS worker privilege policy
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: node dist/infrastructure/database/verify-news-worker-runtime-role.js

      - name: NEWS worker runtime persistence
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npx tsx --test test/news.worker-runtime.integration.test.ts

      - name: Collection persistence integration tests
        if: steps.ci-plan.outputs.full_regression == 'true'
        shell: bash
        run: |
          export DATABASE_URL="postgresql://radar_worker_runtime:${DB_RUNTIME_PASSWORD}@localhost:5432/radar_fiscal_test"
          npm run test:collection-integration

      - name: DOE-SP NCM evidence rebuild guard
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npx tsx --test test/doe-sp.ncm-rebuild-guard.integration.test.ts

      - name: DOE-SP rebuild guard for ANAT analyses and run items (P-INT-02)
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npx tsx --test test/doe-sp.anatomy-guard.integration.test.ts

      - name: Authentication and RLS integration tests
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npm run test:integration

      - name: ONB-01 adversarial tenant/CNAE/company integration
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npx tsx --test test/onboarding-integrity.integration.test.ts

      - name: ONB-02 R3 full graph and adversarial hard-delete tests
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npx tsx --test test/onb02-company-purge-graph.integration.test.ts

      - name: News API integration test
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npx tsx --test test/news.api.integration.test.ts

      - name: TAX-06 baseline dry-run
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npm run taxonomy:baseline:dry-run

      - name: TAX-06 baseline integration tests
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npm run test:taxonomy-baseline-integration

      # TAX-10 intentionally runs as a dedicated sequential gate after TAX-06.
      - name: TAX-10 v1.1 successor integration
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npx tsx --test test/taxonomy.v1-1.integration.test.ts

      - name: NCM official catalog idempotency
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npx tsx --test test/ncm-catalog.import.integration.test.ts

      - name: Publication NCM enrichment integration
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npx tsx --test test/publication-ncm.enrichment.integration.test.ts

      - name: Archive NCM filter integration
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npx tsx --test test/archive-ncm-filter.integration.test.ts

      - name: Archive act-type scale/filter integration
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npx tsx --test test/archive-act-type-filter.integration.test.ts

      - name: Archive date filter integration
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npx tsx --test test/archive-date-filter.integration.test.ts

      - name: Product/NCM API integration test
        if: steps.ci-plan.outputs.full_regression == 'true'
        shell: bash
        run: |
          set -o pipefail
          npx tsx --test test/product-ncm.integration.test.ts 2>&1 | tee product-ncm-integration.log

      - name: TAX-12 compatibility and graph hygiene integration
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npx tsx --test test/taxonomy.tax12.integration.test.ts

      # TAX-11 commits a high-numbered curated release; keep it the last gate.
      - name: TAX-11 curation end-to-end integration
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npx tsx --test test/taxonomy.curation.integration.test.ts

      # Scope events are append-only: the executor fixtures cannot be cleaned
      # up, so this runs after every other database test of the job.
      - name: DOU-CLEAN-01 executor integration (append-only fixtures, runs last)
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npx tsx --test test/dou-historical-cleanup.executor.integration.test.ts


      - name: Require full regression before merge
        if: ${{ !cancelled() }}
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: python3 .github/scripts/ci-plan.py --kind backend --require-full

      - name: Upload Product/NCM integration diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: product-ncm-integration-diagnostics
          path: product-ncm-integration.log
          retention-days: 1
          if-no-files-found: ignore

  dou-clean-02-pg18:
    name: DOU-CLEAN-02 isolated PG18 contracts
    needs: verify
    if: needs.verify.result == 'success' && needs.verify.outputs.pg18_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare official PostgreSQL 18 test image
        # Image provisioning only. The SQL fixture itself has --network none.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep jq
          docker pull postgres:18-bookworm

      - name: Recovery barrier and privilege integration (synthetic fixtures only)
        shell: bash
        run: env -i PATH="$PATH" bash ops/dou-clean-02/runner/test-pg18-isolated.sh --run-isolated-fixture

  onb01-pg18:
    name: ONB-01 migrations 042-043 and identity/RLS on PostgreSQL 18
    needs: verify
    if: needs.verify.result == 'success' && needs.verify.outputs.full_regression == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: radar_fiscal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/radar_fiscal_test
      DATABASE_URL: postgresql://radar_app_runtime:ci-runtime-password-with-at-least-32-chars@localhost:5432/radar_fiscal_test
      DB_RUNTIME_PASSWORD: ci-runtime-password-with-at-least-32-chars
      DB_CURATOR_RUNTIME_PASSWORD: ci-curator-password-with-at-least-32-chars
      JWT_ACCESS_SECRET: ci-jwt-secret-with-at-least-32-characters
      AUTH_REFRESH_COOKIE_NAME: radar_refresh_token
      PUBLIC_API_ALLOWED_ORIGINS: https://public.example
      DB_POOL_MAX: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply complete migrations including ONB-01 042 and 043
        run: npm run db:prepare
      - name: Clean synthetic legacy audit fixtures (isolated PG18 only)
        run: node ops/onb02/audit-backfill.mjs --apply --ack-irreversible-r7
      - name: Verify onboarding migration on PostgreSQL 18
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d radar_fiscal_test -v ON_ERROR_STOP=1 -Atc "
            SELECT CASE WHEN EXISTS(
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public'
                AND table_name='tenant_onboarding_profiles'
                AND column_name='company_name'
                AND is_nullable='YES'
            ) AND EXISTS(
              SELECT 1 FROM pg_trigger WHERE tgname='trg_establishment_company_root'
            ) THEN 'PASS' ELSE 'BLOCK' END;
          " | grep -qx PASS
      - name: Signup consent and authentication/RLS on PG18
        run: npx tsx --test test/public-signup.integration.test.ts
      - name: AUTH-RESET isolated inbox, token one-use and global session revocation on PG18
        run: npx tsx --test test/password-reset.integration.test.ts
      - name: Adversarial CNAE/branch/isolation on PG18
        run: npx tsx --test test/onboarding-integrity.integration.test.ts
      - name: ONB-02 R3 hard-delete full graph on PG18
        run: npx tsx --test test/onb02-company-purge-graph.integration.test.ts
      - name: ONB-02 R7 graph-only purge and timeout rollback on PG18
        run: npx tsx --test test/onb02-r6-purge.integration.test.ts
      - name: ONB-02 R7.1 unknown event preflight and actual CLI on PG18
        run: npx tsx --test test/onb02-r71-backfill.integration.test.ts
      - name: ONB-02 R7.4 historical contracts and direct-rule lock isolation on PG18
        run: npx tsx --test test/onb02-r74-historical-events.integration.test.ts
      - name: ONB-02 R7.3 documented TAX-10 CLI on a separate synthetic PG18 database
        run: npx tsx --test test/onb02-r73-tax10-cli.integration.test.ts
      - name: ONB-02 R7.2 authors and six historical simulation contexts on PG18
        run: npx tsx --test test/onb02-r72-backfill.integration.test.ts
      - name: ONB-02 R7 audit allowlist and resumable backfill 150k on PG18
        run: timeout --signal=TERM --kill-after=10s 300s npx tsx --test test/onb02-r7-audit.integration.test.ts
      - name: ONB-02 R3 semantic SQL evidence on isolated PG18
        shell: bash
        run: bash ops/onb02/ci-evidence-pg18.sh

  onb03-links-pg18:
    name: ONB-03 operational links approval-publication-reversal on PostgreSQL 18
    needs: verify
    if: needs.verify.result == 'success' && needs.verify.outputs.full_regression == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: radar_fiscal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/radar_fiscal_test
      DATABASE_URL: postgresql://radar_app_runtime:ci-runtime-password-with-at-least-32-chars@localhost:5432/radar_fiscal_test
      DB_RUNTIME_PASSWORD: ci-runtime-password-with-at-least-32-chars
      DB_CURATOR_RUNTIME_PASSWORD: ci-curator-password-with-at-least-32-chars
      JWT_ACCESS_SECRET: ci-jwt-secret-with-at-least-32-characters
      AUTH_REFRESH_COOKIE_NAME: radar_refresh_token
      PUBLIC_API_ALLOWED_ORIGINS: https://public.example
      DB_POOL_MAX: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply complete migrations including ONB-01 042 and 043
        run: npm run db:prepare
      - name: Clean synthetic legacy audit fixtures (isolated PG18 only)
        run: node ops/onb02/audit-backfill.mjs --apply --ack-irreversible-r7
      - name: ONB-03 real API approval publication reversal and profile invariance
        run: node --test test/f2-operational-links.pg18.integration.mjs
      - name: ONB-03.6 unit flow, loaded save performance and atomic root purge on PG18
        run: ONB036_CATALOG_LOAD=true node --import tsx --test test/onboarding-unit-flow.integration.test.ts

