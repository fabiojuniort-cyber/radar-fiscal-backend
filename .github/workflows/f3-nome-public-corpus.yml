name: F3 Nome official corpus (offline)
on:
  pull_request:
    paths:
      - ops/f3-nome-01/collect-public-corpus.py
      - .github/workflows/f3-nome-public-corpus.yml
      - docs/f3-nome-02/**
permissions:
  contents: read
jobs:
  public-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen official corpus offline
        run: python3 ops/f3-nome-01/collect-public-corpus.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f3-nome-public-corpus
          path: docs/f3-nome-02/public-corpus.json
