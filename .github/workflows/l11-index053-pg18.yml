name: L11 Index053 PG18 Realistic Purge Benchmark

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'migrations/053_collection_filter_purge_lookup_indexes.sql'
      - 'test/collection-filter.l11-index053.integration.test.ts'
      - '.github/workflows/l11-index053-pg18.yml'

permissions:
  contents: read

jobs:
  pg18-index053:
    name: 053 indexes, EXPLAIN and 535k-item 500-act purge (isolated PG18)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: radar_fiscal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/radar_fiscal_test
      DATABASE_URL: postgresql://radar_app_runtime:ci-runtime-password-with-at-least-32-chars@localhost:5432/radar_fiscal_test
      DB_RUNTIME_PASSWORD: ci-runtime-password-with-at-least-32-chars
      DB_WORKER_RUNTIME_PASSWORD: ci-worker-password-with-at-least-32-chars
      DB_CURATOR_RUNTIME_PASSWORD: ci-curator-password-with-at-least-32-chars
      JWT_ACCESS_SECRET: ci-jwt-secret-with-at-least-32-characters
      AUTH_REFRESH_COOKIE_NAME: radar_refresh_token
      PUBLIC_API_ALLOWED_ORIGINS: https://public.example
      DB_POOL_MAX: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply complete schema including index-only migration 053
        run: npm run db:prepare
      - name: Verify migration checksum recorded
        run: |
          result=$(PGPASSWORD=postgres psql -h localhost -U postgres -d radar_fiscal_test -v ON_ERROR_STOP=1 -Atc "
            SELECT CASE WHEN EXISTS (
              SELECT 1 FROM schema_migrations
              WHERE filename='053_collection_filter_purge_lookup_indexes.sql'
            ) THEN 'PASS' ELSE 'FAIL' END;
          ")
          test "$result" = PASS
      - name: EXPLAIN and 500-act purge on 535k collection_items (isolated only)
        timeout-minutes: 30
        run: npx tsx --test test/collection-filter.l11-index053.integration.test.ts
