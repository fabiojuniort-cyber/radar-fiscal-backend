name: ONB02-PG18-PERF-02 faithful ONB01 PG18.6
on:
  push:
    branches:
      - diag/onb02-pg18-perf-02-20261113
    paths:
      - '.github/workflows/onb02-pg18-perf-02.yml'
      - 'scripts/diagnostics/onb02-pg18-perf-02-evidence.mjs'
permissions:
  contents: read
concurrency:
  group: perf02-${{ github.ref }}
  cancel-in-progress: false

jobs:
  faithful-pg18-6:
    name: ONB01 original sequence / PostgreSQL 18.6 ONLY
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: radar_fiscal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      NODE_ENV: test
      PERF_PG_VARIANT: '18.6'
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/radar_fiscal_test
      DATABASE_URL: postgresql://radar_app_runtime:ci-runtime-password-with-at-least-32-chars@localhost:5432/radar_fiscal_test
      DB_RUNTIME_PASSWORD: ci-runtime-password-with-at-least-32-chars
      DB_CURATOR_RUNTIME_PASSWORD: ci-curator-password-with-at-least-32-chars
      JWT_ACCESS_SECRET: ci-jwt-secret-with-at-least-32-characters
      AUTH_REFRESH_COOKIE_NAME: radar_refresh_token
      PUBLIC_API_ALLOWED_ORIGINS: https://public.example
      DB_POOL_MAX: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Verify #310 base SHA and diagnostic-only file diff
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ef7a079591579bd95984ff0c84cbe505f1dcb1d4 HEAD
          git diff --name-only ef7a079591579bd95984ff0c84cbe505f1dcb1d4..HEAD | sort > /tmp/perf02-files
          printf '%s\n' .github/workflows/onb02-pg18-perf-02.yml scripts/diagnostics/onb02-pg18-perf-02-evidence.mjs | sort > /tmp/perf02-expected
          diff -u /tmp/perf02-expected /tmp/perf02-files
      - name: Fail closed on image digest, service image identity and PG18.6 server
        id: image_gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-results
          IMAGE='postgres:18.6-bookworm'
          echo "IMAGE_SOURCE=Docker Official Image docker.io/library/postgres"
          echo "IMAGE_TAG=$IMAGE"
          docker image inspect "$IMAGE" --format 'IMAGE_ID={{.Id}} REPO_DIGESTS={{json .RepoDigests}}' | tee perf-results/image-18.6.txt
          grep -q 'sha256:' perf-results/image-18.6.txt
          IMAGE_ID=$(docker image inspect "$IMAGE" --format '{{.Id}}')
          CID=$(docker ps --filter "ancestor=$IMAGE" -q | head -n1)
          test -n "$CID"
          RUNNING_IMAGE_ID=$(docker inspect "$CID" --format '{{.Image}}')
          test "$RUNNING_IMAGE_ID" = "$IMAGE_ID"
          echo "CONTAINER_IMAGE_ID=$RUNNING_IMAGE_ID" | tee -a perf-results/image-18.6.txt
          ACTUAL=$(PGPASSWORD=postgres psql -h localhost -U postgres -d radar_fiscal_test -Atc 'SHOW server_version')
          echo "SERVER_VERSION=$ACTUAL" | tee -a perf-results/image-18.6.txt
          if ! [[ "$ACTUAL" =~ ^18\.6([[:space:]]|$) ]]; then
            echo 'FAIL_CLOSED: PG18.6 not confirmed; no fallback is allowed'
            exit 1
          fi
          echo 'IMAGE_18_6_VERIFIED=true' | tee -a perf-results/image-18.6.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply complete migrations including ONB-01 042 and 043
        id: migrations
        run: npm run db:prepare
      - name: Clean synthetic legacy audit fixtures (isolated PG18 only)
        run: node ops/onb02/audit-backfill.mjs --apply --ack-irreversible-r7
      - name: Verify onboarding migration on PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h localhost -U postgres -d radar_fiscal_test -v ON_ERROR_STOP=1 -Atc "
            SELECT CASE WHEN EXISTS(
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public'
                AND table_name='tenant_onboarding_profiles'
                AND column_name='company_name'
                AND is_nullable='YES'
            ) AND EXISTS(
              SELECT 1 FROM pg_trigger WHERE tgname='trg_establishment_company_root'
            ) THEN 'PASS' ELSE 'BLOCK' END;
          " | grep -qx PASS
      - name: Signup consent and authentication/RLS on PG18
        run: npx tsx --test test/public-signup.integration.test.ts
      - name: Adversarial CNAE/branch/isolation on PG18
        run: npx tsx --test test/onboarding-integrity.integration.test.ts
      - name: ONB-02 R3 hard-delete full graph on PG18
        run: npx tsx --test test/onb02-company-purge-graph.integration.test.ts
      - name: ONB-02 R7 graph-only purge and timeout rollback on PG18
        run: npx tsx --test test/onb02-r6-purge.integration.test.ts
      - name: ONB-02 R7.1 unknown event preflight and actual CLI on PG18
        run: npx tsx --test test/onb02-r71-backfill.integration.test.ts
      - name: ONB-02 R7.4 historical contracts and direct-rule lock isolation on PG18
        run: npx tsx --test test/onb02-r74-historical-events.integration.test.ts
      - name: ONB-02 R7.3 documented TAX-10 CLI on separate synthetic PG18 database
        run: npx tsx --test test/onb02-r73-tax10-cli.integration.test.ts
      - name: ONB-02 R7.2 authors and six historical simulation contexts on PG18
        run: npx tsx --test test/onb02-r72-backfill.integration.test.ts
      - name: Snapshot metadata BEFORE official R7 (no EXPLAIN ANALYZE)
        run: node scripts/diagnostics/onb02-pg18-perf-02-evidence.mjs before
      - name: ONB-02 R7 official allowlist and resumable backfill 150k on PG18
        id: official
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p perf-results
          timeout --signal=TERM --kill-after=10s 300s npx tsx --test test/onb02-r7-audit.integration.test.ts 2>&1 | tee perf-results/official-18.6.log
      - name: Snapshot metadata AFTER official R7 and checkpoint
        if: always() && steps.migrations.outcome == 'success'
        run: node scripts/diagnostics/onb02-pg18-perf-02-evidence.mjs after
      - name: ONB-02 R3 semantic SQL evidence if official passed
        if: steps.official.outcome == 'success'
        shell: bash
        run: bash ops/onb02/ci-evidence-pg18.sh
      - name: Upload isolated diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ONB02-PG18-PERF-02-fidelity-18.6
          path: perf-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Fail closed if any required earlier step or official test failed
        if: always()
        shell: bash
        run: |
          echo "IMAGE_GATE=${{ steps.image_gate.outcome }}"
          echo "MIGRATIONS=${{ steps.migrations.outcome }}"
          echo "OFFICIAL_R7=${{ steps.official.outcome }}"
          test "${{ steps.image_gate.outcome }}" = "success"
          test "${{ steps.migrations.outcome }}" = "success"
          test "${{ steps.official.outcome }}" = "success"
