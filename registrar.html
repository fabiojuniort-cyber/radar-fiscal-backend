<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta — TriBusca</title><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#08306B"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/app-shell.css"></head><body class="auth-page"><main class="auth-shell"><a href="/" class="auth-brand"><img src="/logo.webp" alt="TriBusca"></a><section class="auth-card"><div class="eyebrow">7 dias para conhecer a TriBusca</div><h1>Criar conta</h1><p>Experimente a TriBusca por 7 dias. Nenhum pagamento é solicitado.</p><form id="register-form"><label>Seu nome<input id="reg-name" autocomplete="name" required placeholder="Seu nome"></label><label>E-mail profissional<input id="reg-email" type="email" autocomplete="email" required placeholder="voce@empresa.com.br"></label><label>Empresa<input id="reg-company" autocomplete="organization" required placeholder="Nome da empresa"></label><label>Senha<input id="reg-password" type="password" minlength="8" autocomplete="new-password" required placeholder="Mínimo de 8 caracteres" aria-describedby="pw-hint"><small id="pw-hint" class="field-hint">Use pelo menos 8 caracteres.</small></label><button class="btn primary full" type="submit">Criar conta e começar</button><div id="auth-message" class="auth-message" role="alert" aria-live="polite"></div></form><div class="auth-sep"></div><p class="auth-switch">Já possui conta? <a href="/login.html">Entrar</a></p></section></main><script src="/auth.js"></script></body></html>
