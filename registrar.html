<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrar — TriBusca</title><link rel="stylesheet" href="/style.css"></head><body class="auth-page"><main class="auth-shell"><a href="/" class="auth-brand"><img src="/logo.webp" alt="TriBusca"></a><section class="auth-card"><div class="eyebrow">7 dias para conhecer a TriBusca</div><h1>Criar conta</h1><p>Cadastro de protótipo para navegar nas telas internas e consultar o acervo. Nenhum pagamento é solicitado.</p><form id="register-form"><label>Seu nome<input id="reg-name" required placeholder="Seu nome"></label><label>E-mail profissional<input id="reg-email" type="email" required placeholder="voce@empresa.com.br"></label><label>Empresa<input id="reg-company" required placeholder="Nome da empresa"></label><label>Senha<input id="reg-password" type="password" minlength="4" required placeholder="Crie uma senha"></label><button class="btn primary full" type="submit">Criar conta e começar</button><div id="auth-message" class="auth-message"></div></form><div class="auth-sep"></div><p class="auth-switch">Já possui conta? <a href="/login.html">Entrar</a></p></section></main><script src="/auth.js"></script></body></html>
